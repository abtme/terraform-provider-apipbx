name: Release

# Two ways to release, both waiting for an approval in the `release` environment (required reviewer: abtme) before
# the job starts, and only that approved job can read the signing key (the OpenBao role is bound to environment
# `release`):
#   - Actions -> Release -> Run workflow on main with major / minor / patch: tags main's HEAD with the next version
#     after the latest v* tag (v0.2.0 -> major v1.0.0, minor v0.3.0, patch v0.2.1), then releases it;
#   - push a v* tag (it still waits for the approval). Tag ruleset "release tags": only an admin can move or delete
#     a v* tag, so a released version is never changed underneath.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version goes up (tags the head of main)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: arc-runners-apipbx
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the head of main
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run it on main, not $GITHUB_REF"; exit 1; }
          git fetch -q --tags origin
          if git tag --points-at HEAD | grep -q '^v'; then echo "main's head is already released as $(git tag --points-at HEAD)"; exit 1; fi
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}
          case "$BUMP" in
            major) VERSION="v$((major + 1)).0.0" ;;
            minor) VERSION="v${major}.$((minor + 1)).0" ;;
            patch) VERSION="v${major}.${minor}.$((patch + 1))" ;;
            *) echo "bump must be major, minor or patch"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
          echo "tagged $(git rev-parse --short HEAD) as $VERSION (was ${latest:-none}, $BUMP)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Fetches the GPG signing key fresh from OpenBao on every run via
      # GitHub's own OIDC token - no secret ever stored in GitHub. The
      # jwt-github auth mount/role is scoped to this repo's approved
      # `release` environment jobs only
      # (see auth/jwt-github/role/terraform-provider-apipbx-release).
      - name: Fetch GPG key from OpenBao and prime gpg-agent
        env:
          BAO_ADDR: https://vault.turnbull.uk:8200
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/openbao/openbao/releases/download/v2.6.0/openbao_2.6.0_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" bao
          export PATH="$RUNNER_TEMP/bin:$PATH"

          JWT=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${BAO_ADDR}" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')

          BAO_TOKEN=$(bao write -field=token auth/jwt-github/login \
            role=terraform-provider-apipbx-release jwt="$JWT")
          export VAULT_TOKEN="$BAO_TOKEN"

          bao kv get -field=private-key secret/terraform-registry/gpg | gpg --batch --import
          PASSPHRASE=$(bao kv get -field=passphrase secret/terraform-registry/gpg)
          FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 1200" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 1200" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

          # Priming sign: caches the unlocked key's passphrase in the running
          # gpg-agent so GoReleaser's later --batch (non-interactive) sign
          # calls succeed without needing the passphrase passed again.
          echo "priming" | gpg --batch --pinentry-mode loopback \
            --passphrase "$PASSPHRASE" --local-user "$FINGERPRINT" \
            --detach-sign --output /dev/null -

          echo "GPG_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
